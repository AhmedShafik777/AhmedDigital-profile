<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الملف الرقمي</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <meta name="theme-color" content="#0f766e">
</head>

<body>

    <header class="profile-header">
        <img id="profileImage" src="assets/profile.jpg" alt="الصورة الشخصية">
        <h1 id="profileName"></h1>
        <p id="profileTitle"></p>
        <p id="profileAbout"></p>
    </header>

    <section class="contact-buttons">
        <a id="callBtn" class="btn call">اتصال</a>
        <a id="whatsappBtn" class="btn whatsapp">واتساب</a>
        <a id="emailBtn" class="btn email">بريد إلكتروني</a>
        <a id="websiteBtn" class="btn website">الموقع</a>
        <a id="locationBtn" class="btn location">الموقع الجغرافي</a>
    </section>

    <section class="social-links">
        <div id="socialLinks"></div>
    </section>

    <section class="products">
        <h2>المنتجات والخدمات</h2>
        <div id="categoryButtons"></div>
        <div id="productsList"></div>
    </section>

    <section class="articles">
        <h2>مقالات ومعلومات</h2>
        <div id="articlesList"></div>
    </section>

    <section class="save-contact">
        <a id="vcardBtn" class="btn save">حفظ جهة الاتصال</a>
    </section>

    <section class="share-section">
        <h2>شارك الملف الرقمي</h2>
        <p>امسح الرمز لفتح الملف على أي هاتف</p>

        <div id="qrcode"></div>

        <button id="downloadQr">تحميل QR</button>
        <button id="shareLink">مشاركة الرابط</button>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة</p>
    </footer>

    <script src="data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
